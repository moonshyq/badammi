  <script>
document.addEventListener("DOMContentLoaded", async () => {
    const apiUrl = "/api/Fruits/GetAllFruits";

    try {
        const response = await fetch(apiUrl, {
            headers: {
                "ngrok-skip-browser-warning": "true"
            }
        });
        if (!response.ok) throw new Error("Ошибка загрузки API");
        const products = await response.json();
        
        // --- Фильтрация продуктов по типу ---
        const freshFruits = products.filter(p => p.type && p.type.toLowerCase() === "fruit");
        const freshVegetables = products.filter(p => p.type && p.type.toLowerCase() === "vegetables");
        const driedProducts = products.filter(p => p.type && p.type.toLowerCase() === "dried");


        const freshMenu = document.getElementById("fresh");
        if (freshMenu) {
            freshMenu.innerHTML = "";

            if (freshFruits.length > 0) {
                freshFruits.forEach(fruit => {
                    const li = document.createElement("li");
                    li.innerHTML = `<a class="fix-a" href="shop-single.html?id=${fruit.id}">${fruit.name}</a>`;
                    freshMenu.appendChild(li);
                });
            }

            const allFreshLi = document.createElement("li");
            if (freshFruits.length > 0) {
                 const dividerEnd = document.createElement("li");
                 dividerEnd.innerHTML = `<hr style="margin-top: 5px; margin-bottom: 5px;">`;
                 freshMenu.appendChild(dividerEnd);
            }
            allFreshLi.innerHTML = `<a class="fix-a" href="shop-1.html"><strong>All Fresh Fruit Catalog</strong></a>`;
            freshMenu.appendChild(allFreshLi);
        }

        const vegetablesMenu = document.getElementById("vegetables");
        if (vegetablesMenu) {
            vegetablesMenu.innerHTML = "";

            if (freshVegetables.length > 0) {
                freshVegetables.forEach(veg => {
                    const li = document.createElement("li");
                    li.innerHTML = `<a class="fix-a" href="shop-single-veg.html?id=${veg.id}">${veg.name}</a>`;
                    vegetablesMenu.appendChild(li);
                });
            }
            
            // Общий каталог для Fresh Vegetables
            const allVegLi = document.createElement("li");
            if (freshVegetables.length > 0) {
                 const dividerEnd = document.createElement("li");
                 dividerEnd.innerHTML = `<hr style="margin-top: 5px; margin-bottom: 5px;">`;
                 vegetablesMenu.appendChild(dividerEnd);
            }
            allVegLi.innerHTML = `<a class="fix-a" href="shop-1-veg.html"><strong>All Vegetable Catalog</strong></a>`;
            vegetablesMenu.appendChild(allVegLi);
        }

        const driedMenu = document.getElementById("dried");
        if (driedMenu) {
            driedMenu.innerHTML = "";
            
            driedProducts.forEach(product => {
                const li = document.createElement("li");
                li.innerHTML = `<a class="fix-a" href="shop-single-dried.html?id=${product.id}">${product.name}</a>`;
                driedMenu.appendChild(li);
            });

            const allLi = document.createElement("li");
            if (driedProducts.length > 0) {
                 const dividerEnd = document.createElement("li");
                 dividerEnd.innerHTML = `<hr style="margin-top: 5px; margin-bottom: 5px;">`;
                 driedMenu.appendChild(dividerEnd);
            }
            allLi.innerHTML = `<a href="shop-2.html" class="fix-a"><strong>All Dried Catalog</strong></a>`;
            driedMenu.appendChild(allLi);
        }


    } catch (err) {
        console.error("Ошибка при загрузке продуктов:", err);
    }
});
</script>

<style>
    #loading {
    position: fixed; /* Закрепляем на экране */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff; /* Цвет фона, пока идет загрузка */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Убедитесь, что он поверх всего */
}

/* Контейнер для логотипа, чтобы его центрировать */
.loader {
    /* Дополнительные стили, если нужны, но для анимации они не критичны */
}

/* Стили для самого изображения, где будет анимация */
.loader img {
    width: 100px; /* Установите желаемый размер */
    height: auto;
    /* --- КЛЮЧЕВАЯ ЧАСТЬ: АНИМАЦИЯ --- */
    animation: bounce 1.2s infinite alternate; /* Применяем анимацию */
    transform-origin: center; /* Центр, вокруг которого происходит трансформация */
}

/* Определение анимации */
@keyframes bounce {
    /* Кадры анимации */
    0% {
        transform: scale(0.9); /* Начальное состояние: немного отдалено */
        opacity: 0.8;
    }
    50% {
        transform: scale(1.15); /* Середина: немного приближено ("прыгнуло") */
        opacity: 1;
    }
    100% {
        transform: scale(1.0); /* Конец: возвращается к нормальному размеру */
        opacity: 0.9;
    }
}
</style>
